# Griffin nucleosome-profiling SLURM resources

__default__:
    partition: htc
    time: "24:00:00"
    mem: 4G
    ncpus: 1
    ntasks: 1
    output: logs/cluster/{rule}.{wildcards.samples}.%j.out
    error: logs/cluster/{rule}.{wildcards.samples}.%j.err
    JobName: "{rule}.{wildcards.samples}"

